services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - DOMAIN=localhost
      - BACK_HOST=back
    depends_on:
      back:
        condition: service_healthy
    networks:
      - termofeed-net

  back:
    image: ${BACK_IMAGE:-ghcr.io/termofeed/termofeed-back:latest}
    environment:
      - PORT=8080
      - PUBLIC_BASE_URL=http://localhost:5173
      - ALLOWED_ORIGINS=http://localhost:5173
      - TRUSTED_PROXY=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - termofeed-net

networks:
  termofeed-net:
    driver: bridge
